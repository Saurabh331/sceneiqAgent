<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SceneIQ Architecture Flow</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: auto;
        }
        svg {
            background-color: #252526;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: 20px;
        }
        .box {
            fill: #333333;
            stroke: #555555;
            stroke-width: 2;
            rx: 8;
        }
        .agent-box {
            fill: #4b3259;
            stroke: #9c27b0;
            stroke-width: 2;
            rx: 8;
        }
        .tool-box {
            fill: #2c3e50;
            stroke: #34495e;
            stroke-width: 2;
            rx: 8;
        }
        .text {
            fill: #ffffff;
            font-size: 14px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .subtext {
            fill: #aaaaaa;
            font-size: 11px;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        .tech-text {
            fill: #4CAF50;
            font-size: 10px;
            font-style: italic;
            text-anchor: middle;
            dominant-baseline: middle;
        }
        
        /* Dashed paths for data flow */
        .path {
            fill: none;
            stroke: #4CAF50;
            stroke-width: 3;
            stroke-dasharray: 8;
            animation: dash 1s linear infinite;
        }

        .path.alt {
            stroke: #2196F3;
        }

        .path.gemini {
            stroke: #FF9800;
        }

        .path.agent {
            stroke: #9c27b0;
        }

        @keyframes dash {
            to {
                stroke-dashoffset: -16;
            }
        }
    </style>
</head>
<body>

<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Arrowhead markers -->
        <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4CAF50" />
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2196F3" />
        </marker>
        <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9800" />
        </marker>
        <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#9c27b0" />
        </marker>
    </defs>

    <!-- Background Groupings (Optional, but good for structure) -->
    <rect x="730" y="50" width="240" height="680" fill="#1e272e" rx="10" stroke="#485460" stroke-width="2" stroke-dasharray="5"/>
    <text x="850" y="70" class="text" fill="#808e9b">Available Agent Tools</text>

    <!-- Nodes -->
    
    <!-- UI Layer -->
    <rect x="50" y="350" width="160" height="90" class="box" />
    <text x="130" y="380" class="text">Frontend UI</text>
    <text x="130" y="400" class="subtext">Chat & Session Config</text>
    <text x="130" y="420" class="tech-text">Streamlit</text>

    <!-- API Layer -->
    <rect x="280" y="350" width="160" height="90" class="box" />
    <text x="360" y="380" class="text">API Gateway</text>
    <text x="360" y="400" class="subtext">Routing & Auth</text>
    <text x="360" y="420" class="tech-text">FastAPI / Uvicorn</text>

    <!-- Agent Layer -->
    <rect x="510" y="350" width="160" height="90" class="agent-box" />
    <text x="590" y="380" class="text">Agent Orchestrator</text>
    <text x="590" y="400" class="subtext">Tool Selection & Reasoning</text>
    <text x="590" y="420" class="tech-text">Vertex AI Reasoning Engine / LangChain</text>

    <!-- Tools Layer -->
    <rect x="770" y="100" width="160" height="90" class="tool-box" />
    <text x="850" y="130" class="text">BigQuery RAG</text>
    <text x="850" y="150" class="subtext">Vector Search (Script)</text>
    <text x="850" y="170" class="tech-text">GoogleGenerativeAIEmbeddings</text>

    <rect x="770" y="220" width="160" height="90" class="tool-box" />
    <text x="850" y="250" class="text">Parallel Search</text>
    <text x="850" y="270" class="subtext">Real-world Web Search</text>
    <text x="850" y="290" class="tech-text">Official MCP Python SDK</text>

    <rect x="770" y="340" width="160" height="90" class="tool-box" />
    <text x="850" y="370" class="text">Producers Module</text>
    <text x="850" y="390" class="subtext">Storyboard PDF Generation</text>
    <text x="850" y="410" class="tech-text">Imagen 3 / FPDF / GCS</text>

    <rect x="770" y="460" width="160" height="90" class="tool-box" />
    <text x="850" y="490" class="text">Writers Module</text>
    <text x="850" y="510" class="subtext">Script Doctor & Dialog</text>
    <text x="850" y="530" class="tech-text">Gemini 2.5 Flash</text>

    <rect x="770" y="580" width="160" height="90" class="tool-box" />
    <text x="850" y="610" class="text">Enthusiasts Module</text>
    <text x="850" y="630" class="subtext">CYOA & Deep Research</text>
    <text x="850" y="650" class="tech-text">Gemini 2.5 Pro</text>

    <!-- Core LLM Layer -->
    <rect x="1000" y="350" width="160" height="90" class="box" />
    <text x="1080" y="380" class="text">Core Foundation Model</text>
    <text x="1080" y="400" class="subtext">LLM Capabilities</text>
    <text x="1080" y="420" class="tech-text">Gemini 2.5 Pro / Flash</text>

    <!-- Edges (Animated Paths) -->
    
    <!-- UI <-> API -->
    <path d="M 210 380 L 270 380" class="path" marker-end="url(#arrow-green)" />
    <path d="M 280 400 L 220 400" class="path" marker-end="url(#arrow-green)" />
    
    <!-- API <-> Agent -->
    <path d="M 440 380 L 500 380" class="path alt" marker-end="url(#arrow-blue)" />
    <path d="M 510 400 L 450 400" class="path alt" marker-end="url(#arrow-blue)" />

    <!-- Agent -> Tools -->
    <path d="M 670 360 C 720 360, 720 145, 760 145" class="path agent" marker-end="url(#arrow-purple)" />
    <path d="M 670 375 C 720 375, 720 265, 760 265" class="path agent" marker-end="url(#arrow-purple)" />
    <path d="M 670 395 L 760 395" class="path agent" marker-end="url(#arrow-purple)" />
    <path d="M 670 415 C 720 415, 720 505, 760 505" class="path agent" marker-end="url(#arrow-purple)" />
    <path d="M 670 430 C 720 430, 720 625, 760 625" class="path agent" marker-end="url(#arrow-purple)" />

    <!-- Tools -> Agent (Response) -->
    <path d="M 770 155 C 730 155, 730 370, 680 370" class="path agent" marker-end="url(#arrow-purple)" />
    <path d="M 770 275 C 730 275, 730 385, 680 385" class="path agent" marker-end="url(#arrow-purple)" />
    <path d="M 770 405 L 680 405" class="path agent" marker-end="url(#arrow-purple)" />
    <path d="M 770 515 C 730 515, 730 425, 680 425" class="path agent" marker-end="url(#arrow-purple)" />
    <path d="M 770 635 C 730 635, 730 440, 680 440" class="path agent" marker-end="url(#arrow-purple)" />

    <!-- Agent / Tools <-> Gemini Model -->
    <path d="M 930 145 C 970 145, 960 370, 990 370" class="path gemini" marker-end="url(#arrow-orange)" />
    <path d="M 930 505 C 970 505, 960 395, 990 395" class="path gemini" marker-end="url(#arrow-orange)" />
    <path d="M 930 625 C 970 625, 960 415, 990 415" class="path gemini" marker-end="url(#arrow-orange)" />
    <path d="M 670 350 C 750 200, 950 200, 1030 340" class="path gemini" marker-end="url(#arrow-orange)" /> <!-- Direct Agent to Gemini for reasoning -->

    <!-- Explanatory Text at Bottom -->
    <text x="600" y="750" fill="#dddddd" font-size="16" text-anchor="middle">
        Animated Data Flow Directive: Green (HTTP Req/Res) | Blue (FastAPI Routing) | Purple (Agent Tool Execution) | Orange (LLM Inference / Reasoning)
    </text>

</svg>

</body>
</html>
